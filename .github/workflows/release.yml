name: Release

# Creates a GitHub Release for every release tag that overshare pushes to this
# repo. The release text is the tag annotation, i.e. the release notes passed
# to `overshare release --notes`, verbatim; nothing else is generated.
#
# The source repo exports this file as `.github/workflows/release.yml` of the
# target repo. Edit it there (`oss/`), never in the target repo: the next
# export overwrites a manual change.

"on":                                # quoted: yamllint truthy rule
  push:
    tags: ["v*"]

# Nothing by default; the one job below gets only what it needs.
permissions: {}

jobs:
  release:
    # The target repo is public, so GitHub-hosted runners.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write                # create the release
    steps:
      # The notes come from the tag object through the API, so the job needs
      # no checkout. Not `gh release create --notes-from-tag`: it reads the
      # annotation from a local tag only and refuses `--repo`, and a shallow
      # `actions/checkout` of a tag does not keep the annotation.
      - name: Read the tag annotation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          read -r TYPE SHA < <(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '"\(.object.type) \(.object.sha)"')
          # overshare pushes annotated tags; a lightweight one has no notes.
          if [ "$TYPE" != tag ]; then
            echo "::error::$GITHUB_REF_NAME is not an annotated tag, no release notes to publish"
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$SHA" --jq .message > "$RUNNER_TEMP/notes.md"

      # `--verify-tag` aborts instead of creating a tag if it is gone.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file "$RUNNER_TEMP/notes.md" --repo "$GITHUB_REPOSITORY"
